<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech Synthesizer</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h1 class="text-center mb-4">Text to Speech Synthesizer</h1>

        <div class="card">
            <div class="card-body">
                <form id="ttsForm">
                    <div class="mb-3">
                        <label for="text" class="form-label">Enter your text</label>
                        <textarea class="form-control" id="text" name="text" rows="4"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="textFile" class="form-label">Or upload a text file</label>
                        <input type="file" class="form-control" id="textFile" name="textFile" accept=".txt">
                        <small class="form-text text-muted">Supported format: .txt files</small>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="language" class="form-label">Select Voice</label>
                            <select class="form-select" id="language" name="language">
                                <optgroup label="English">
                                    <option value="en-us">English (US)</option>
                                    <option value="en-uk">English (UK)</option>
                                    <option value="en-au">English (Australian)</option>
                                    <option value="en-in">English (Indian)</option>
                                </optgroup>
                                <optgroup label="Spanish">
                                    <option value="es-es">Spanish (Spain)</option>
                                    <option value="es-mx">Spanish (Mexico)</option>
                                </optgroup>
                                <optgroup label="French">
                                    <option value="fr-fr">French (France)</option>
                                    <option value="fr-ca">French (Canadian)</option>
                                </optgroup>
                                <optgroup label="Portuguese">
                                    <option value="pt-br">Portuguese (Brazilian)</option>
                                    <option value="pt-pt">Portuguese (Portugal)</option>
                                </optgroup>
                            </select>
                            <small class="form-text text-muted">Choose from different accents and variations</small>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="speakingRate" class="form-label">Speaking Rate</label>
                            <select class="form-select" id="speakingRate" name="speakingRate">
                                <option value="normal">Normal Speed (1x)</option>
                                <option value="slow">Slow Speed (0.5x)</option>
                            </select>
                            <small class="form-text text-muted mt-1">
                                Note: Speed control is limited to normal and slow options due to TTS engine limitations
                            </small>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary" id="synthesizeBtn">
                            <i class="fas fa-microphone me-2"></i>Synthesize Speech
                        </button>
                    </div>
                </form>

                <div id="audioContainer" class="mt-4 d-none">
                    <audio id="audioPlayer" controls class="w-100">
                        Your browser does not support the audio element.
                    </audio>
                </div>

                <div id="loadingIndicator" class="text-center mt-4 d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Generating speech...</p>
                </div>

                <div id="errorAlert" class="alert alert-danger mt-4 d-none" role="alert">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
